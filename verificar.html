<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Verificación Documental | HERMED & Asociados
</title>


<style>

body{

margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b1320;
color:white;

display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}


.container{

width:90%;
max-width:450px;

background:white;
color:#222;

border-radius:20px;

padding:35px;

text-align:center;

box-shadow:0 10px 40px rgba(0,0,0,.3);

}


.logo{

width:150px;
margin-bottom:20px;

}


h1{

font-size:25px;
color:#b08d2c;

}


.subtitle{

font-size:14px;
color:#666;

}


input{

width:90%;

padding:15px;

margin-top:20px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

text-align:center;

}


button{

margin-top:20px;

padding:15px 35px;

border:none;

border-radius:10px;

background:#b08d2c;

color:white;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#8d6f20;

}


.resultado{

margin-top:25px;

padding:20px;

border-radius:10px;

display:none;

}


.valido{

background:#e8f7ed;

color:#126b32;

}


.error{

background:#fdeaea;

color:#9b1c1c;

}


.footer{

margin-top:30px;

font-size:12px;

color:#777;

}


</style>


</head>


<body>


<div class="container">


<img 
src="assets/logo-principal.png"
class="logo"
>


<h1>
Verificación Documental
</h1>


<p class="subtitle">

Sistema de autenticidad documental

<br>

HERMED & Asociados

</p>



<input 
id="codigo"
placeholder="Ingrese código VER-HM-XXXX"
>



<button onclick="validar()">

VALIDAR DOCUMENTO

</button>



<div id="resultado" class="resultado">

</div>



<div class="footer">

© HERMED & Asociados 2026

<br>

Sistema Documental Jurídico

</div>


</div>





<script>


const URL_API =

"https://script.google.com/macros/s/AKfycbyf7A9Hkd-VdGnz-YhF_queWoXAfmXrx72mhF8RKy-NBS5rwmQnQMb8ntkzpDNYX4dW/exec";





function validar(){
alert("BOTÓN FUNCIONA");

const codigo =

document
.getElementById("codigo")
.value
.trim();

console.log("Código enviado:", codigo);

const resultado =

document
.getElementById("resultado");



if(!codigo){


resultado.style.display="block";

resultado.className="resultado error";


resultado.innerHTML=

"Debe ingresar un código de verificación";


return;

}



// Crear función de respuesta global

window.respuestaHERMED = function(data){


resultado.style.display="block";



if(data.estado==="VALIDO"){



resultado.className="resultado valido";



resultado.innerHTML=

`

<h3>✓ DOCUMENTO VÁLIDO</h3>


<p>
<strong>Número:</strong><br>
${data.numero}
</p>


<p>
<strong>Tipo:</strong><br>
${data.tipo}
</p>


<p>
<strong>Fecha:</strong><br>
${new Date(data.fecha).toLocaleDateString()}
</p>


<p>
<strong>Estado:</strong><br>
${data.situacion}
</p>

`;



}

else{


resultado.className="resultado error";


resultado.innerHTML=

`

<h3>Documento no encontrado</h3>

<p>
El código ingresado no existe en el registro HERMED.
</p>

`;

}


};




// Crear consulta JSONP

const script = document.createElement("script");



script.src =

URL_API

+

"?codigo="

+

encodeURIComponent(codigo)

+

"&callback=respuestaHERMED";




document.body.appendChild(script);



}


</script>


</body>

</html>
